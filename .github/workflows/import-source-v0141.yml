name: Import verified 0.14.1 sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touchline-source-publication
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'DevHHM/touchline-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Fetch public main without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/DevHHM/touchline-editor.git
          git -c credential.helper= -c core.askPass= fetch --no-tags origin refs/heads/main
          git checkout --detach FETCH_HEAD
