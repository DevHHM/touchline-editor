          MANIFEST = json.loads(zlib.decompress(base64.b64decode(MANIFEST_DATA)))
          OLD, NEW = MANIFEST["old"], MANIFEST["new"]

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args, env=None):
              result = subprocess.run(["git", "-c", "credential.helper=", "-c", "core.askPass=", "-c", "core.hooksPath=/dev/null", *args], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode:
                  # Never print argv/environment or the credential-bearing push configuration.
                  raise SystemExit("Git operation failed: " + args[0])
              return result.stdout

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          parser = argparse.ArgumentParser()
          parser.add_argument("--local-only", action="store_true", help="Offline validation: commit/tag locally, never contact or push a remote")
          args = parser.parse_args()
          require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong repository")
          require(os.environ.get("GITHUB_REF") == "refs/heads/main", "Run only on main")
          root = pathlib.Path.cwd().resolve()
          head = git("rev-parse", "HEAD").decode().strip()
          require(head == os.environ.get("GITHUB_SHA"), "Main advanced since dispatch; review and dispatch again")
          require(not git("status", "--porcelain"), "Checkout must be clean")
          git("merge-base", "--is-ancestor", BASE, "HEAD")
          setup_changes = set(git("diff", "--name-only", BASE, "HEAD").decode().splitlines())
          require(setup_changes == {ARCHIVE, WORKFLOW}, "Only the new source ZIP and this new workflow may differ from the reviewed base")
          require(git("ls-tree", "-r", "--name-only", BASE, "--", ARCHIVE, WORKFLOW) == b"", "Setup paths already existed at the reviewed base")
          if not args.local_only:
              require(not git("ls-remote", "--tags", "origin", "refs/tags/" + TAG), "Version tag already exists; never overwrite a published tag")
          require(not git("tag", "--list", TAG), "Local version tag already exists")

          for name in set(OLD) | set(NEW):
              p = pathlib.PurePosixPath(name)
              require(name == p.as_posix() and not p.is_absolute() and ".." not in p.parts and ".git" not in p.parts and ":" not in name and "\\" not in name, "Unsafe manifest path")
              require(name not in {ARCHIVE, WORKFLOW}, "Managed source collides with setup")
          tracked = set(git("ls-tree", "-r", "--name-only", "HEAD").decode().splitlines())
          preserve = tracked - set(OLD)
          require(not (set(NEW) & preserve), "Source would overwrite unrelated tracked paths")
          preserved_hashes = {p: sha(git("show", "HEAD:" + p)) for p in preserve}
          for name, expected in OLD.items():
              require(name in tracked and sha(git("show", BASE + ":" + name)) == expected, "Reviewed base manifest mismatch: " + name)
              require(sha(git("show", "HEAD:" + name)) == expected, "Managed source changed since review: " + name)

          archive = root / ARCHIVE
          require(sha(archive.read_bytes()) == ARCHIVE_SHA, "Source ZIP checksum mismatch")
          payload = {}
          with zipfile.ZipFile(archive) as zipped:
              entries = zipped.infolist()
              require(len(entries) == len(NEW) and {e.filename for e in entries} == set(NEW), "ZIP members differ from the exact public manifest")
              require(sum(e.file_size for e in entries) <= 60_000_000, "Unexpected expanded ZIP size")
              for entry in entries:
                  require(not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16), "Non-file ZIP member")
                  content = zipped.read(entry)
                  require(sha(content) == NEW[entry.filename], "ZIP member checksum mismatch: " + entry.filename)
                  payload[entry.filename] = content

          added = set(NEW) - set(OLD)
          modified = {p for p in set(NEW) & set(OLD) if NEW[p] != OLD[p]}
          removed = set(OLD) - set(NEW)
          changed = added | modified | removed
          require((len(added), len(modified), len(removed)) == (60, 52, 0), "Publication delta differs from reviewed plan")
          for name in sorted(added | modified):
              destination = root / name
              require(root in destination.resolve().parents and not destination.is_symlink(), "Unsafe destination")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload[name])
          for name in sorted(removed):
              (root / name).unlink()
          git("add", "--", *sorted(changed))
          staged = set(git("diff", "--cached", "--name-only").decode().splitlines())
          require(staged == changed, "Unexpected staged paths")
          for name, expected in NEW.items():
              require(sha(git("show", ":" + name)) == expected, "Staged source mismatch: " + name)
          for name, expected in preserved_hashes.items():
              require(sha(git("show", ":" + name)) == expected, "Unrelated tracked file changed: " + name)
          git("-c", "user.name=github-actions[bot]", "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com", "commit", "-m", "Publish verified Touchline Editor 0.14.1 sources")
          commit = git("rev-parse", "HEAD").decode().strip()
          require(not git("status", "--porcelain"), "Import left an uncommitted file")
          git("tag", TAG, commit)
          if args.local_only:
              print("LOCAL VALIDATION ONLY: " + commit + "; 60 added, 52 modified, 0 removed; all unrelated paths preserved")
              raise SystemExit(0)

          token = os.environ.get("GITHUB_TOKEN")
          require(bool(token), "Missing ephemeral GitHub Actions token")
          push_env = os.environ.copy()
          push_env["GIT_CONFIG_COUNT"] = "1"
          push_env["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
          push_env["GIT_CONFIG_VALUE_0"] = "AUTHORIZATION: basic " + base64.b64encode(("x-access-token:" + token).encode()).decode()
          # Token stays in the child process environment; never URL, argv, disk, or logs.
          # Atomic, ordinary pushes: concurrent main/tag changes reject both updates.
          git("push", "--atomic", "origin", "HEAD:refs/heads/main", "refs/tags/" + TAG, env=push_env)
          summary = "Published verified 0.14.1 source commit `" + commit + "` and tag `" + TAG + "`.\n\n60 added, 52 modified, 0 removed; all unrelated tracked paths preserved.\n\nSource archive SHA256: `" + ARCHIVE_SHA + "`.\n"
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf8")
          print(summary)
          PY
