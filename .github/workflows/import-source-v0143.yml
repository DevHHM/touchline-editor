          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def safe_env():
              env = os.environ.copy()
              for key in list(env):
                  if key.startswith(('GIT_TRACE', 'GCM_TRACE', 'GIT_CONFIG_')) or key in {'GITHUB_TOKEN', 'GH_TOKEN', 'GITHUB_PAT'}:
                      env.pop(key, None)
              env.update(GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='never', GIT_ASKPASS='', SSH_ASKPASS='')
              return env


          def git(*args, env=None):
              result = subprocess.run(['git', '-c', 'credential.helper=', '-c', 'core.askPass=',
                                       '-c', 'core.hooksPath=/dev/null', '-c', 'http.followRedirects=false', *args],
                                      env=safe_env() if env is None else env, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(result.returncode == 0, 'Git operation failed (details withheld): ' + args[0])
              return result.stdout


          def tree(revision):
              entries = {}
              for raw in git('ls-tree', '-rz', revision).split(b'\0'):
                  if not raw:
                      continue
                  metadata, path = raw.split(b'\t', 1)
                  mode, kind, oid = metadata.decode('ascii').split()
                  name = path.decode('utf-8')
                  require(name not in entries and kind == 'blob' and mode == '100644', 'Git tree contains a nonregular or duplicate path')
                  entries[name] = {'mode': mode, 'oid': oid}
              return entries


          def checked_path(name, managed=False):
              path = pathlib.PurePosixPath(name)
              require(name == path.as_posix() and not path.is_absolute() and '\\' not in name and '\x00' not in name, 'Noncanonical source path')
              require(all(part not in {'', '.', '..', '.git'} and not part.endswith((' ', '.')) and not re.search(r'[<>:"|?*\x00-\x1f]', part) for part in path.parts), 'Unsafe source path')
              reserved = {'con', 'prn', 'aux', 'nul'} | {f'com{i}' for i in range(1, 10)} | {f'lpt{i}' for i in range(1, 10)}
              require(all(part.split('.')[0].casefold() not in reserved for part in path.parts), 'Windows-reserved source path')
              if managed:
                  require(not set(path.parts) & {'.github', '.wrangler', 'node_modules', '__pycache__', 'bin', 'obj', 'target', 'output'}, 'Private or executable setup directory in source manifest')
                  require(path.suffix.lower() not in {'.exe', '.dll', '.pdb', '.fm', '.dmp', '.log', '.zip', '.pyc', '.pem', '.key'}, 'Forbidden source artifact')
                  require(path.name not in {'.env', '.dev.vars', 'api.json', 'index.json', 'hosts.yml', 'credentials'}, 'Private source file')
                  require(name not in {ARCHIVE, WORKFLOW}, 'Source collides with browser setup')
              return path


          def destination(root, name):
              path = root.joinpath(*checked_path(name, managed=True).parts)
              require(path.resolve().is_relative_to(root), 'Source destination escapes repository')
              current = path
              while current != root:
                  require(not current.is_symlink(), 'Symlink in destination path')
                  current = current.parent
              return path


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--local-only', action='store_true', help='Offline fixture validation: local commit/tag only, no remote read or write')
              args = parser.parse_args()
              require(os.environ.get('GITHUB_REPOSITORY') == REPOSITORY and os.environ.get('GITHUB_REPOSITORY_OWNER') == OWNER, 'Wrong repository/owner')
              require(os.environ.get('GITHUB_REF') == 'refs/heads/main' and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch', 'Owner dispatch on main is required')
              require(os.environ.get('GITHUB_ACTOR') == OWNER and os.environ.get('GITHUB_TRIGGERING_ACTOR') == OWNER, 'Only the repository owner may dispatch or rerun this import')
              require(os.environ.get('GITHUB_WORKFLOW_REF') == REPOSITORY + '/' + WORKFLOW + '@refs/heads/main', 'Unexpected workflow identity')
              # The ephemeral Actions token is read into memory only and removed before any Git child runs.
              token = os.environ.pop('GITHUB_TOKEN', None)
              packed = base64.b64decode(MANIFEST_DATA, validate=True)
              public_data = zlib.decompress(packed)
              require(len(public_data) < 200000 and sha(public_data) == MANIFEST_SHA, 'Public manifest checksum mismatch')
              manifest = json.loads(public_data)
              BASE_FILES, OLD, NEW = manifest['base'], manifest['old'], manifest['new']
              require((len(BASE_FILES), len(OLD), len(NEW)) == (222, 216, 234), 'Manifest counts differ from review')
              for name in BASE_FILES:
                  checked_path(name)
              for collection in (OLD, NEW):
                  require(len({name.casefold() for name in collection}) == len(collection), 'Case-insensitive manifest collision')
                  for name, digest in collection.items():
                      checked_path(name, managed=True)
                      require(re.fullmatch(r'[0-9a-f]{64}', digest) is not None, 'Invalid source digest')
              root = pathlib.Path.cwd().resolve()
              head = git('rev-parse', 'HEAD').decode().strip()
              require(head == os.environ.get('GITHUB_SHA') == os.environ.get('GITHUB_WORKFLOW_SHA'), 'Main advanced since dispatch; review and dispatch again')
              require(not git('status', '--porcelain'), 'Checkout must be clean')
              git('merge-base', '--is-ancestor', BASE, head)
              require(tree(BASE) == {n: {'mode': v['mode'], 'oid': v['oid']} for n, v in BASE_FILES.items()}, 'Reviewed base Git tree mismatch')
              for name, value in BASE_FILES.items():
                  require(sha(git('show', BASE + ':' + name)) == value['sha256'], 'Reviewed base file checksum mismatch: ' + name)
              setup = {ARCHIVE, WORKFLOW}
              current_tree = tree('HEAD')
              require(set(current_tree) == set(BASE_FILES) | setup, 'Only the new archive and this workflow may be added to the reviewed base')
              require(not setup & set(BASE_FILES), 'Setup paths already exist at reviewed base')
              for name in BASE_FILES:
                  require(current_tree[name] == tree_entry(BASE_FILES[name]), 'Reviewed base file changed in browser setup: ' + name)
              # The browser first adds the ZIP, then adds this workflow. Later setup fixes may modify only this workflow.
              commits = git('rev-list', '--reverse', BASE + '..HEAD').decode().splitlines()
              require(len(commits) >= 2, 'Expected the separate archive and workflow browser commits')
              previous = BASE
              for position, commit in enumerate(commits):
                  require(git('rev-list', '--parents', '-n', '1', commit).decode().split() == [commit, previous], 'Browser setup must be a linear sequence')
                  status = git('diff', '--name-status', previous, commit).decode().splitlines()
                  expected = ['A\t' + ARCHIVE] if position == 0 else (['A\t' + WORKFLOW] if position == 1 else ['M\t' + WORKFLOW])
                  require(status == expected, 'After the ZIP/workflow browser commits, only this workflow may change')
                  previous = commit
              require(sha(git('show', commits[0] + ':' + ARCHIVE)) == ARCHIVE_SHA, 'The browser ZIP commit contains different archive bytes')
              require(not git('tag', '--list', TAG), 'Version tag already exists locally')
              if not args.local_only:
                  remote = git('ls-remote', '--refs', ORIGIN, 'refs/heads/main', 'refs/tags/' + TAG).decode().splitlines()
                  refs = {line.split()[1]: line.split()[0] for line in remote}
                  require(refs.get('refs/heads/main') == head and 'refs/tags/' + TAG not in refs, 'Remote main changed or version tag already exists')
                  require(bool(token), 'Missing ephemeral Actions token')
              preserve = set(current_tree) - set(OLD)
              require(not set(NEW) & preserve, 'Source would overwrite an unrelated public path')
              for name, digest in OLD.items():
                  require(name in BASE_FILES and BASE_FILES[name]['sha256'] == digest, 'Old managed file differs from reviewed base: ' + name)
                  require(sha(git('show', 'HEAD:' + name)) == digest, 'Old managed file changed since review: ' + name)
              archive = root / ARCHIVE
              require(not archive.is_symlink() and archive.is_file() and archive.stat().st_size == ARCHIVE_BYTES and sha(archive.read_bytes()) == ARCHIVE_SHA, 'Source ZIP size/hash/type mismatch')
              payload = {}
              with zipfile.ZipFile(archive) as zipped:
                  entries = zipped.infolist()
                  require(len(entries) == len(NEW) and {entry.filename for entry in entries} == set(NEW), 'ZIP members differ from exact 234-file manifest')
                  require(sum(entry.file_size for entry in entries) <= 32000000, 'Unexpected expanded ZIP size')
                  for entry in entries:
                      checked_path(entry.filename, managed=True)
                      mode = entry.external_attr >> 16
                      require(not entry.is_dir() and not entry.flag_bits & 1 and stat.S_IFMT(mode) in {0, stat.S_IFREG}, 'Nonregular, encrypted or symlink ZIP member')
                      require(entry.file_size <= 25000000, 'Oversized source member')
                      raw = zipped.read(entry)
                      require(sha(raw) == NEW[entry.filename], 'ZIP member checksum mismatch: ' + entry.filename)
                      destination(root, entry.filename)
                      payload[entry.filename] = raw
              added = set(NEW) - set(OLD)
              modified = {name for name in set(NEW) & set(OLD) if NEW[name] != OLD[name]}
              removed = set(OLD) - set(NEW)
              require((len(added), len(modified), len(removed)) == (18, 35, 0), 'Reviewed source delta changed')
              changed = added | modified | removed
              for name in sorted(added | modified):
                  target = destination(root, name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload[name])
              for name in sorted(removed):
                  destination(root, name).unlink()
              git('add', '--', *sorted(changed))
              require(set(git('diff', '--cached', '--name-only').decode().splitlines()) == changed, 'Unexpected staged paths')
              for name, digest in NEW.items():
                  require(sha(git('show', ':' + name)) == digest, 'Staged source checksum mismatch: ' + name)
              for name in preserve:
                  mode, oid, stage_and_name = git('ls-files', '--stage', '--', name).decode().split(maxsplit=2)
                  require(mode == current_tree[name]['mode'] and oid == current_tree[name]['oid'] and stage_and_name.startswith('0\t'), 'Unrelated staged file changed: ' + name)
              git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  '-c', 'commit.gpgsign=false', 'commit', '-m', 'Publish verified Touchline Editor 0.14.3 sources')
              commit = git('rev-parse', 'HEAD').decode().strip()
              require(git('rev-parse', 'HEAD^').decode().strip() == head and not git('status', '--porcelain'), 'Import commit is not a clean child of browser setup')
              final_tree = tree('HEAD')
              require(set(final_tree) == set(NEW) | preserve, 'Unexpected final tree paths')
              for name in preserve:
                  require(final_tree[name] == current_tree[name], 'Unrelated committed file changed: ' + name)
              for name, digest in NEW.items():
                  require(sha(git('show', 'HEAD:' + name)) == digest, 'Committed source checksum mismatch: ' + name)
              git('tag', TAG, commit)
              summary = {'version': VERSION, 'source_commit': commit, 'source_manifest_files': len(NEW), 'source_zip_sha256': ARCHIVE_SHA,
                         'added': len(added), 'modified': len(modified), 'removed': len(removed), 'unrelated_and_setup_preserved': len(preserve),
                         'tag': TAG, 'status': 'local_validation_only' if args.local_only else 'source_and_tag_published'}
              if args.local_only:
                  print(json.dumps(summary))
                  return
              push_env = safe_env()
              push_env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
              try:
                  # Ordinary atomic push: never force, never overwrite a tag, and never use a configured push URL.
                  git('push', '--atomic', ORIGIN, 'HEAD:refs/heads/main', 'refs/tags/' + TAG, env=push_env)
              finally:
                  push_env.clear()
                  token = None
              refs = dict((line.split()[1], line.split()[0]) for line in git('ls-remote', '--refs', ORIGIN, 'refs/heads/main', 'refs/tags/' + TAG).decode().splitlines())
              require(refs.get('refs/heads/main') == refs.get('refs/tags/' + TAG) == commit, 'Inspect remote publication; post-push ref verification did not match')
              text = json.dumps(summary, indent=2)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('```json\n' + text + '\n```\n', encoding='utf-8')
              print(text)


          def tree_entry(value):
              return {'mode': value['mode'], 'oid': value['oid']}


          if __name__ == '__main__':
              main()
          PY
