name: Import verified 0.14.5 sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touchline-source-publication
  cancel-in-progress: false

jobs:
  import:
    if: >-
      ${{ github.repository == 'DevHHM/touchline-editor' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: never
    steps:
      - name: Fetch public main without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git config core.symlinks false
          git config core.filemode false
          git remote add origin https://github.com/DevHHM/touchline-editor.git
          git -c credential.helper= -c core.askPass= -c core.hooksPath=/dev/null -c http.followRedirects=false fetch --no-tags origin refs/heads/main
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Verify pinned source and atomically publish main plus v0.14.5
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
