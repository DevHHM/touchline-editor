[package]
name = "touchline-editor"
version = "0.14.5"
edition = "2024"
description = "A local, native Football Manager editor with build-verified adapters"

[features]
default = []
# Local, explicitly authorized FM27 health experiment. Never enabled in releases.
fm27-health-experiment = []
fm27-transfer-experiment = ["fm27-health-experiment"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
ctr = "0.9"
zstd = "0.13"
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "=0.33.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

